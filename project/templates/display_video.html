<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processed Video - SportioHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-bolt text-purple-400"></i> SportioHub
            </a>
            <a href="/analyzer" class="text-xs text-purple-400 font-semibold">&larr; Back to Analyzer</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow space-y-6 text-center">
        <h1 class="text-2xl font-black text-white">Analyzed Video Output</h1>
        <div class="rounded-2xl overflow-hidden border border-gray-800 bg-black shadow-2xl">
            <video width="100%" controls class="w-full aspect-video">
                <source src="{{ video_path }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div>
            <a href="{{ video_path }}" download class="inline-flex items-center gap-2 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-6 rounded-xl transition text-xs shadow-lg">
                <i class="fa-solid fa-download"></i> Download Video
            </a>
        </div>
    </main>
</body>
</html>
